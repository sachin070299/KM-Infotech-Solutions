<style>
:root{--ink:#F8FAFC;--bg:#020617;--panel:#0B1329;--panel2:#111C44;--line:rgba(56,189,248,.16);--mist:rgba(148,163,184,.08);--mute:#CBD5E1;--mute2:#94A3B8;--or:#F97316;--ort:#FB923C;--blue:#3B82F6;--sky:#0EA5E9;--solid:linear-gradient(135deg,#2563EB,#0EA5E9);--ok:#34D399;--okb:rgba(16,185,129,.14);--wa:#FBBF24;--wab:rgba(245,158,11,.14);--bad:#F87171;--badb:rgba(239,68,68,.14);--info:#93C5FD;--infob:rgba(59,130,246,.16);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
body{background:var(--bg);background-image:radial-gradient(900px 500px at 8% -10%,rgba(59,130,246,.18),transparent 60%),radial-gradient(700px 420px at 100% 0%,rgba(249,115,22,.10),transparent 60%),linear-gradient(rgba(59,130,246,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.035) 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed;min-height:100vh}
a{color:#7DD3FC}a:hover{color:#BAE6FD}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.disp{font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.02em}
.grad{background:linear-gradient(90deg,#F97316,#F59E0B 40%,#38BDF8);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{position:sticky;top:0;z-index:20;background:rgba(2,6,23,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:15px;letter-spacing:.02em;line-height:1.1}
.brand img{height:40px;width:auto}
.brand small{display:block;font-size:9px;letter-spacing:.28em;color:#38BDF8;font-weight:600}
.brand:hover{color:#fff}
.sysnav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.sysnav a{color:#CBD5E1;text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:600;font-size:14px;border-bottom:2px solid transparent}
.sysnav a.on{color:#fff;background:rgba(59,130,246,.14);box-shadow:inset 0 -2px 0 var(--or)}
.sysnav a:hover{background:rgba(148,163,184,.1);color:#fff}
.topr{display:flex;gap:8px;align-items:center}
.topr select,.topr button{background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:999px;min-height:36px;padding:0 12px;cursor:pointer}
.shell{display:flex;min-height:calc(100vh - 57px)}
.side{width:250px;flex:0 0 250px;background:rgba(11,19,41,.72);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;max-height:calc(100vh - 57px);position:sticky;top:57px}
.side h4{margin:16px 10px 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#38BDF8;font-weight:700}
.side a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:#E2E8F0;text-decoration:none;font-weight:500}
.side a:hover{background:rgba(148,163,184,.08);color:#fff}
.side a.on{background:linear-gradient(90deg,rgba(59,130,246,.22),rgba(59,130,246,.04));color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--or)}
.side .cnt{font-size:11px;background:rgba(148,163,184,.12);border-radius:999px;padding:1px 8px;color:#CBD5E1}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.crumbs{font-size:13px;color:var(--mute2);margin-bottom:6px}.crumbs a{color:var(--mute2);text-decoration:none}.crumbs a:hover{color:#fff}
.hd{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.hd h1{margin:0;font-size:27px}.hd p{margin:4px 0 0;color:var(--mute2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:38px;padding:0 16px;border-radius:999px;border:1px solid rgba(148,163,184,.35);background:rgba(15,23,42,.6);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#F1F5F9;white-space:nowrap;transition:all .2s}
.btn:hover{border-color:#38BDF8;color:#fff;box-shadow:0 0 0 3px rgba(56,189,248,.12)}
.btn.p{background:linear-gradient(135deg,#F97316,#F59E0B);border-color:transparent;color:#1A0B00;box-shadow:0 8px 24px -10px rgba(249,115,22,.7)}.btn.p:hover{filter:brightness(1.08);color:#1A0B00}
.btn.d{background:var(--solid);border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px rgba(37,99,235,.8)}.btn.d:hover{filter:brightness(1.1)}
.btn.g{border-color:rgba(148,163,184,.25)}
.btn.r{border-color:rgba(248,113,113,.6);color:#FCA5A5}
.btn.sm{min-height:30px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.card{background:linear-gradient(180deg,rgba(17,28,68,.62),rgba(11,19,41,.88));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 24px 60px -40px rgba(59,130,246,.55)}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:linear-gradient(180deg,rgba(17,28,68,.7),rgba(11,19,41,.9));border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);display:block;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,#3B82F6,#0EA5E9,transparent)}
.kpi .l{font-size:12px;color:var(--mute2)}.kpi .v{font-size:28px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--mute2)}
.kpi.warn .v{color:#FBBF24}.kpi.warn::after{background:linear-gradient(90deg,#F59E0B,transparent)}.kpi.bad .v{color:#F87171}.kpi.bad::after{background:linear-gradient(90deg,#EF4444,transparent)}
a.kpi:hover{border-color:#38BDF8;box-shadow:0 0 0 3px rgba(56,189,248,.1)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:rgba(11,19,41,.7);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500;color:#CBD5E1}
.chip.on{background:var(--solid);color:#fff;border-color:transparent}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.s0{background:rgba(148,163,184,.14);color:#CBD5E1}.s1{background:var(--wab);color:var(--wa);border-color:rgba(245,158,11,.25)}.s2{background:var(--infob);color:var(--info);border-color:rgba(59,130,246,.3)}.s3{background:var(--okb);color:var(--ok);border-color:rgba(16,185,129,.25)}.s4{background:var(--badb);color:var(--bad);border-color:rgba(239,68,68,.3)}
.tw{background:rgba(11,19,41,.85);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{border-collapse:collapse;width:100%}
th{background:#111C44;text-align:left;font-size:12px;color:#93C5FD;font-weight:700;padding:10px 12px;white-space:nowrap;position:sticky;top:0;letter-spacing:.02em}
td{border-top:1px solid rgba(148,163,184,.1);padding:9px 12px;vertical-align:middle;color:#E2E8F0}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(59,130,246,.08)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.search{min-height:38px;border:1px solid var(--line);border-radius:999px;padding:0 14px;width:240px;background:rgba(11,19,41,.9);color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--mute2)}
.fld.w{grid-column:1/-1}
.fld input,.fld select,.fld textarea,.cell input,.cell select{min-height:38px;border:1px solid rgba(56,189,248,.22);border-radius:9px;padding:0 10px;background:#0B1329;font-size:14px;color:#F8FAFC;font-weight:400;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus,.cell input:focus,.cell select:focus,.search:focus{outline:none;border-color:#38BDF8;box-shadow:0 0 0 3px rgba(56,189,248,.18)}
.fld textarea{padding:8px 10px;min-height:70px}
.fld .ro{min-height:38px;display:flex;align-items:center;padding:0 10px;background:rgba(148,163,184,.07);border:1px solid rgba(148,163,184,.1);border-radius:9px;font-size:14px;color:#F1F5F9;font-weight:500}
.cell input,.cell select{min-height:32px;min-width:80px}
.req::after{content:" *";color:var(--bad)}
.sec{font-size:15px;font-weight:800;margin:18px 0 8px;color:#fff}
.lay{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.lay>.l{flex:999 1 560px;min-width:0}.lay>.r{flex:1 1 280px;min-width:0}
.feed{display:flex;flex-direction:column;gap:8px;font-size:13px}
.feed div{border-left:2px solid rgba(56,189,248,.35);padding-left:10px;line-height:1.45}
.feed b{color:#fff}.feed span{color:var(--mute2)}
.toast{position:fixed;right:18px;bottom:18px;background:#0B1329;border:1px solid #38BDF8;color:#fff;padding:12px 16px;border-radius:12px;max-width:420px;z-index:99;box-shadow:0 12px 40px rgba(14,165,233,.3);font-size:14px;line-height:1.45}
.toast.err{border-color:#F87171;box-shadow:0 12px 40px rgba(239,68,68,.3)}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.75);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal .box{background:#0B1329;border:1px solid var(--line);border-radius:18px;padding:20px;max-width:780px;width:100%;box-shadow:0 30px 80px -20px rgba(59,130,246,.45)}
.note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.35);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;color:#FDE68A}
.ok{background:var(--okb);border:1px solid rgba(16,185,129,.35);border-radius:12px;padding:12px 14px;font-size:13px}
.tour{counter-reset:s;display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.tour li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:#CBD5E1}
.tour li b{color:#fff}
.tour li::before{content:counter(s);flex:0 0 22px;height:22px;border-radius:7px;background:var(--solid);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
.bar{height:8px;background:rgba(148,163,184,.14);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#F97316,#F59E0B)}
.mus td{padding:4px;text-align:center;font-size:11px;font-weight:700}.mus td:first-child{text-align:left;white-space:nowrap;font-weight:500;font-size:12px}
.P{color:var(--ok)}.A{color:#FCA5A5;background:var(--badb)}.L{color:var(--info);background:var(--infob)}.W{color:#64748B}.H{color:var(--wa);background:var(--wab)}.T{color:var(--wa)}
.hero{background:radial-gradient(600px 300px at 80% 40%,rgba(59,130,246,.25),transparent 70%),linear-gradient(180deg,rgba(17,28,68,.75),rgba(11,19,41,.9));border:1px solid var(--line);border-radius:24px;padding:36px;display:flex;flex-wrap:wrap;gap:28px;align-items:center;margin-bottom:18px;position:relative;overflow:hidden}
.hero h1{font-size:42px;line-height:1.08;margin:0 0 12px}
.hero p{color:#CBD5E1;font-size:16px;line-height:1.65;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#38BDF8}
.sys{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.sys .card{display:flex;flex-direction:column;gap:10px;transition:transform .3s,border-color .3s}
.sys .card:hover{transform:translateY(-3px);border-color:rgba(56,189,248,.45)}
.sys h3{margin:0;font-size:21px}
.tags{display:flex;flex-wrap:wrap;gap:5px}.tags span{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);color:#BFDBFE;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:500}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-weight:600}
.flow span{background:rgba(11,19,41,.9);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:#E2E8F0}.flow i{font-style:normal;color:var(--or)}
.kiosk{background:linear-gradient(135deg,#1E3A8A,#0EA5E9);border-radius:26px;padding:12px;max-width:560px;box-shadow:0 30px 80px -30px rgba(14,165,233,.7)}.kiosk>div{background:#0B1329;border-radius:18px;padding:24px;min-height:520px;display:flex;flex-direction:column;gap:14px}
.qr{display:grid;grid-template-columns:repeat(13,7px);background:#fff;padding:6px;border-radius:6px}.qr i{width:7px;height:7px;display:block}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
pre.file{background:#020617;border:1px solid var(--line);color:#BAE6FD;border-radius:12px;padding:14px;font-size:12px;overflow:auto;max-height:360px}
.muted{color:var(--mute2)}
.embed [data-a=print]{display:none!important}
.phone-f{width:340px;flex:0 0 auto;background:#05070D;padding:10px;box-shadow:0 0 0 2px #1E293B,0 40px 90px -30px rgba(14,165,233,.6);position:relative}
.phone-f.ios{border-radius:52px}.phone-f.and{border-radius:34px;padding:8px}
.ph-scr{background:#020617;border-radius:42px;height:700px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.phone-f.and .ph-scr{border-radius:26px}
.ph-sb{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 6px;font-size:13px;font-weight:700;color:#fff;position:relative;min-height:36px}
.ph-island{position:absolute;left:50%;top:9px;width:104px;height:28px;margin-left:-52px;background:#000;border-radius:20px}
.ph-hole{position:absolute;left:50%;top:10px;width:14px;height:14px;margin-left:-7px;background:#000;border-radius:50%;box-shadow:0 0 0 2px #111}
.phone-f.and .ph-sb{padding:10px 18px 4px;font-size:12px}
.ph-app{flex:1;display:flex;flex-direction:column;min-height:0}
.ph-top{display:flex;align-items:center;gap:10px;padding:6px 18px 10px;border-bottom:1px solid rgba(56,189,248,.12)}
.ph-name{font-weight:800;font-size:20px;letter-spacing:-.02em}
.ph-app.md .ph-top{background:#0B1329;padding:10px 16px}.ph-app.md .ph-name{font-size:17px}
.ph-body{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px;background-image:radial-gradient(300px 200px at 100% 0,rgba(59,130,246,.15),transparent 70%)}
.ph-tabs{display:flex;border-top:1px solid rgba(56,189,248,.14);background:rgba(11,19,41,.96);padding:6px 6px 4px}
.ph-tabs button{flex:1;background:none;border:0;color:#94A3B8;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;cursor:pointer;border-radius:14px}
.ph-tabs .ti{font-size:16px;line-height:1}
.ph-tabs button.on{color:#F97316}
.phone-f.and .ph-tabs button.on{color:#fff}.phone-f.and .ph-tabs button.on .ti{background:rgba(59,130,246,.35);border-radius:999px;padding:3px 16px}
.ph-home{height:20px;display:flex;align-items:center;justify-content:center;background:rgba(11,19,41,.96)}
.ph-home::after{content:"";width:120px;height:5px;border-radius:3px;background:#E2E8F0;opacity:.8}
.phone-f.and .ph-home::after{width:90px;height:4px}
.m-h{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.m-badge{background:#F97316;color:#1A0B00;border-radius:999px;font-size:11px;padding:1px 8px}
.m-card{background:linear-gradient(180deg,rgba(17,28,68,.75),rgba(11,19,41,.95));border:1px solid rgba(56,189,248,.18);border-radius:16px;padding:12px}
.phone-f.and .m-card{border-radius:12px}
.m-t{font-weight:700;font-size:14px;color:#fff}.m-s{font-size:12px;color:#94A3B8}
.m-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid rgba(148,163,184,.1)}
.m-num{font-weight:800;font-size:13px;color:#E2E8F0;white-space:nowrap}.m-num.low{color:#FBBF24}
.m-acts{display:flex;gap:6px;margin-top:9px}
.m-btn{border:1px solid rgba(148,163,184,.35);background:rgba(15,23,42,.8);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.m-btn.pri{background:linear-gradient(135deg,#F97316,#F59E0B);color:#1A0B00;border-color:transparent}
.phone-f.and .m-btn{border-radius:10px}.phone-f.and .m-btn.pri{background:linear-gradient(135deg,#2563EB,#0EA5E9);color:#fff}
.m-btn.wide{width:100%;margin-top:8px;padding:11px}
.m-in{width:100%;min-height:40px;margin-top:6px;border-radius:10px;border:1px solid rgba(56,189,248,.25);background:#0B1329;color:#fff;padding:0 10px;font:inherit;font-size:13px}
textarea.m-in{padding:8px 10px}
.m-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.m-kpi{background:rgba(11,19,41,.95);border:1px solid rgba(56,189,248,.18);border-radius:14px;padding:10px}.m-kpi b{display:block;font-size:22px;font-weight:800}.m-kpi span{font-size:11px;color:#94A3B8}
.m-punch{display:block;margin:14px auto 8px;width:132px;height:132px;border-radius:50%;border:0;font-size:17px;font-weight:800;color:#fff;cursor:pointer;background:radial-gradient(circle at 35% 30%,#3B82F6,#1D4ED8);box-shadow:0 0 0 8px rgba(59,130,246,.18),0 0 40px rgba(59,130,246,.6)}
.m-punch.out{background:radial-gradient(circle at 35% 30%,#FB923C,#EA580C);box-shadow:0 0 0 8px rgba(249,115,22,.18),0 0 40px rgba(249,115,22,.6)}
.m-empty{text-align:center;color:#94A3B8;padding:30px 10px;font-size:13px}
.m-note{font-size:11.5px;color:#94A3B8;background:rgba(59,130,246,.08);border-radius:10px;padding:8px 10px}
.m-photo{border:1.5px dashed rgba(56,189,248,.4);border-radius:12px;padding:18px;text-align:center;color:#7DD3FC;font-size:13px}
.m-ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#F97316,#3B82F6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto}
@media (max-width:860px){.top{position:static;gap:8px;padding:10px 12px}.sysnav{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto}.sysnav a{white-space:nowrap}.topr{margin-left:auto}.topr label{font-size:0!important;gap:0!important}.topr select,.topr button{min-height:34px;font-size:12px}.brand small{display:none}.shell{flex-direction:column}.side{width:auto;flex:none;position:static;max-height:none;display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.side h4{display:none}.side a{white-space:nowrap}.side .cnt{display:none}.main{padding:16px}.hero{padding:22px}.hero h1{font-size:30px}.search{width:100%}}
@media print{body{background:#fff;color:#000}.top,.side,.noprint{display:none!important}.main{padding:0}}

</style>

/* ===== KM Infotech Portfolio — core engine ===== */
'use strict';
const KEY = 'km-portfolio-v1';
const DT = {}, SYSTEMS = [], PAGES = {}, ACT = {}, SEEDS = [];
let S = null;            // persisted state
let FORM = null;         // open form draft
let VIEW = {};           // list filters etc.
const RATES = { USD: 1, EUR: 0.92, GBP: 0.79, AED: 3.67, INR: 83 };

/* ---------- utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n, l = 2) => String(n).padStart(l, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const TODAY = iso(new Date());
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return iso(x); };
const diffDays = (a, b) => Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 864e5);
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtN = v => Number(v || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const fmtCur = (v, cur) => { try { return new Intl.NumberFormat('en', { style: 'currency', currency: cur, maximumFractionDigits: 0 }).format(v || 0); } catch (e) { return cur + ' ' + fmtN(v); } };
const money = usd => fmtCur((usd || 0) * RATES[S.settings.cur], S.settings.cur);
const sum = (a, f) => a.reduce((t, x) => t + (Number(f ? f(x) : x) || 0), 0);
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- store ---------- */
function defDT(d) { DT[d.name] = d; }
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || S.v !== 3) seedAll();
  Object.keys(DT).forEach(k => { if (!S.data[k]) S.data[k] = []; });
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function seedAll() {
  S = { v: 3, data: {}, seq: {}, log: [], custom: {}, settings: { cur: 'USD', user: 'Demo Admin' } };
  Object.keys(DT).forEach(k => S.data[k] = []);
  SEEDS.forEach(f => f());
  S.log = [];
  logIt(null, null, 'Demo data loaded');
  save();
}
function nextId(dt) { const d = DT[dt]; S.seq[dt] = (S.seq[dt] || 0) + 1; return d.prefix + '-' + pad(S.seq[dt], 4); }
function all(dt) { return S.data[dt] || []; }
function get(dt, id) { return all(dt).find(r => r.id === id); }
function insert(dt, rec, msg) {
  const d = DT[dt];
  rec.id = rec.id || nextId(dt);
  if (!rec.status && d.states) rec.status = d.states[0];
  rec._c = rec._c || TODAY;
  (d.fields || []).forEach(f => { if (f.t === 'table' && !rec[f.k]) rec[f.k] = []; });
  d.compute && d.compute(rec);
  S.data[dt].push(rec);
  if (msg !== false) logIt(dt, rec.id, msg || 'Created');
  return rec;
}
function setStatus(dt, r, st, note) { r.status = st; logIt(dt, r.id, note || ('Status changed to "' + st + '"')); }
function logIt(dt, id, msg) { S.log.unshift({ t: Date.now(), dt, id, msg, u: S.settings.user }); if (S.log.length > 600) S.log.length = 600; }
function title(dt, r) { if (!r) return ''; const d = DT[dt]; return d.title ? d.title(r) : (r.name || r.title || ''); }
function fieldsOf(dt) { return (DT[dt].fields || []).concat(S.custom[dt] || []); }
function linkLabel(dt, id) { const r = get(dt, id); return r ? id + ' · ' + title(dt, r) : (id || ''); }

/* ---------- status colours ---------- */
function stCls(s) {
  if (!s) return 's0';
  if (/Reject|Cancel|Overdue|Denied|Obsolete|Absent|Critical|Blocked|Expired|Major|No-show|Breakdown/i.test(s)) return 's4';
  if (/Draft|Planned|Expected|Proposed|Scheduled|Invited|Not audited/i.test(s)) return 's0';
  if (/Pending|Review|Approval|Open|Waiting|Investigat|Due|Late|Minor|QC|Raised|Sent|Received$|Partially|Half|OFI|Assigned/i.test(s)) return 's1';
  if (/Complete|Closed|Released|Paid|Accepted|Approved|Active|Present|Conform|OK|Exited|Checked Out|Verified|Capitalised|Issued|Implemented|Resolved|Valid|Compliant|Held|Ordered|PO Created/i.test(s)) return 's3';
  return 's2';
}
const chip = s => !s ? '' : `<span class="st ${stCls(s)}">${esc(s)}</span>`;

/* ---------- ui helpers ---------- */
let toastT;
function toast(msg, err) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', err ? 6000 : 4200);
}
function modal(html) { closeModal(); const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal'; m.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`; m.addEventListener('click', e => { if (e.target === m) closeModal(); }); document.body.appendChild(m); const f = m.querySelector('input,select,textarea,button'); f && f.focus(); }
function closeModal() { const m = $('#modal'); m && m.remove(); }
ACT.closeModal = closeModal;
function go(h) { if (location.hash === h) render(); else location.hash = h; }
function kpi(l, v, s, cls, href) { const tag = href ? 'a' : 'div'; return `<${tag} class="kpi ${cls || ''}" ${href ? `href="${href}"` : ''}><div class="l">${esc(l)}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</${tag}>`; }
function table(cols, rows, opts = {}) {
  return `<div class="tw"><table><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${esc(c.l)}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr ${r._href ? `class="click" data-a="nav" data-h="${r._href}"` : ''}>${cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="muted">${opts.empty || 'Nothing here yet.'}</td></tr>`}</tbody></table></div>`;
}
function barChart(data, o = {}) {
  const w = o.w || 560, h = o.h || 220, pb = 34, pt = 16, pl = 8, max = Math.max(1, ...data.map(d => Math.max(d.v, d.v2 || 0)));
  const bw = (w - pl * 2) / data.length;
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(o.label || 'chart')}" style="max-height:${h}px">`;
  svg += `<line x1="0" x2="${w}" y1="${h - pb}" y2="${h - pb}" stroke="rgba(148,163,184,.3)"/>`;
  data.forEach((d, i) => {
    const x = pl + i * bw, two = d.v2 != null, bwi = two ? bw * .32 : bw * .56;
    const y1 = h - pb - (d.v / max) * (h - pb - pt);
    svg += `<rect x="${x + (two ? bw * .16 : bw * .22)}" y="${y1}" width="${bwi}" height="${h - pb - y1}" rx="3" fill="${d.c || o.color || '#3B82F6'}"><title>${esc(d.l)}: ${esc(o.fmt ? o.fmt(d.v) : fmtN(d.v))}</title></rect>`;
    if (two) { const y2 = h - pb - (d.v2 / max) * (h - pb - pt); svg += `<rect x="${x + bw * .5}" y="${y2}" width="${bwi}" height="${h - pb - y2}" rx="3" fill="${o.color2 || '#F97316'}"><title>${esc(d.l)}: ${esc(fmtN(d.v2))}</title></rect>`; }
    svg += `<text x="${x + bw / 2}" y="${h - pb + 16}" text-anchor="middle" font-size="11" fill="#94A3B8">${esc(String(d.l).slice(0, 12))}</text>`;
    if (!two && o.values !== false) svg += `<text x="${x + bw / 2}" y="${y1 - 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#E2E8F0">${esc(o.fmt ? o.fmt(d.v) : fmtN(d.v))}</text>`;
  });
  return svg + '</svg>';
}
function hbars(data, fmt) { const max = Math.max(1, ...data.map(d => d.v)); return `<div style="display:flex;flex-direction:column;gap:8px">${data.map(d => `<div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>${esc(d.l)}</span><b>${esc(fmt ? fmt(d.v) : fmtN(d.v))}</b></div><div class="bar"><i style="width:${Math.round(d.v / max * 100)}%;background:${d.c || '#F97316'}"></i></div></div>`).join('')}</div>`; }
function legend(items) { return `<div class="row" style="font-size:12px;color:var(--mute)">${items.map(([c, l]) => `<span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:${c};display:inline-block"></i>${esc(l)}</span>`).join('')}</div>`; }
const EMBED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
if (EMBED) document.documentElement.classList.add('embed');
ACT.copyfile = () => { try { navigator.clipboard.writeText(window._file || '').then(() => toast('Copied to clipboard.'), () => toast('Copy was blocked — select the text and copy it.', true)); } catch (e) { toast('Copy was blocked — select the text and copy it.', true); } };
function download(name, text, type) {
  if (EMBED) { window._file = text; modal(`<h2 style="margin:0 0 6px">${esc(name)}</h2><p class="muted">Downloads are disabled in this preview, so copy the contents instead. In the installed system this downloads as a file.</p><pre class="file">${esc(text)}</pre><div class="row"><button class="btn p" data-a="copyfile">Copy</button><button class="btn g" data-a="closeModal">Close</button></div>`); return; } const b = new Blob([text], { type: type || 'text/csv' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ---------- field display & input ---------- */
function dispVal(f, v, rec) {
  if (f.calc) v = f.calc(rec);

  flow: [{ a: 'Issue material', from: ['Draft'], to: 'Issued', p: 1, run: r => issue(r.items, r.id) }] });
function issue(items, ref) {
  const short = items.filter(l => l.item && l.qty > stockOf(l.item));
  if (short.length) return { err: 'Not enough stock: ' + short.map(l => itemName(l.item) + ' (need ' + fmtN(l.qty) + ', have ' + fmtN(stockOf(l.item)) + ')').join('; ') + '. Raise a requisition or run MRP.' };
  items.forEach(l => l.item && l.qty > 0 && ledger(l.item, -l.qty, ref, 'Issued'));
  return null;
}

function bomFor(product) { return all('bom').find(b => b.product === product); }

defDT({ name: 'pp', sys: 'erp', label: 'Production Plan', prefix: 'PP', module: 'Planning', desc: 'Plan output, run MRP to find shortages, and release work orders.', title: r => r.period || 'Plan',
  states: ['Draft', 'MRP Run', 'Work Orders Created'], editIn: ['Draft', 'MRP Run'],
  fields: [{ k: 'period', l: 'Plan period', req: 1, list: 1 }, { k: 'note', l: 'Notes', t: 'area' }, { k: 'lines', l: 'Products to make', t: 'table', cols: [{ k: 'product', l: 'Product', t: 'link', dt: 'item', filter: isFG }, { k: 'qty', l: 'Qty', t: 'num' }, { k: 'bom', l: 'BOM', calc: row => { const b = bomFor(row.product); return b ? b.id : 'No BOM'; } }] }],
  flow: [{ a: 'Run MRP', from: ['Draft', 'MRP Run'], to: 'MRP Run', p: 1, run: r => {
    if (!r.lines.length) return { err: 'Add products to the plan.' };
    const need = {}; r.lines.forEach(l => reqFor(l.product, l.qty || 0).forEach(c => need[c.item] = (need[c.item] || 0) + c.qty));
    r.mrp = Object.keys(need).map(i => { const st = stockOf(i), oo = onOrder(i); return { item: i, req: need[i], stock: st, oo, short: Math.max(0, Math.ceil(need[i] - st - oo)) }; });
    const sh = r.mrp.filter(m => m.short > 0); let pr = '';
    if (sh.length && !all('pr').some(p => p.pp === r.id && ['Draft', 'Pending Approval'].includes(p.status))) { const p = insert('pr', { dept: 'Planning', need: addDays(TODAY, 10), pp: r.id, purpose: 'MRP shortage for ' + r.period + ' (' + r.id + ')', items: sh.map(m => ({ item: m.item, qty: m.short, rem: 'MRP' })), status: 'Pending Approval' }, 'Auto-raised by MRP ' + r.id); pr = p.id; }
    return { msg: 'MRP done: ' + r.mrp.length + ' components checked, ' + sh.length + ' short.' + (pr ? ' Requisition ' + pr + ' sent for approval.' : '') };
  } }, { a: 'Create work orders', from: ['MRP Run'], to: 'Work Orders Created', run: r => { const ids = r.lines.map(l => insert('wo', { product: l.product, qty: l.qty, bom: (bomFor(l.product) || {}).id || '', line: 'Line 1', start: addDays(TODAY, 1), pp: r.id, produced: 0 }, 'Created from plan ' + r.id).id); return { msg: 'Work orders ' + ids.join(', ') + ' created.' }; } }],

  flow: [{ a: 'Approve', from: ['Pending'], to: 'Approved', p: 1, run: r => { const b = leaveBal(r.emp)[r.type]; if (b && r.days > b.bal) return { err: 'Only ' + b.bal + ' ' + r.type + ' days left.' }; let n = 0; for (let d = r.from; d <= r.to; d = addDays(d, 1)) { if (isSun(d)) continue; let a = all('att').find(x => x.emp === r.emp && x.date === d); if (!a) a = insert('att', { emp: r.emp, date: d }, false); Object.assign(a, { st: 'On Leave', in: '', out: '', hrs: 0, ot: 0, src: 'Leave' }); n++; } return { msg: 'Approved. ' + n + ' day(s) marked On Leave in attendance and payroll.' }; } },

function leaveBal(emp) { const ent = { Casual: 8, Sick: 8, Earned: 18 }, out = {}; Object.keys(ent).forEach(k => { const used = sum(all('leave').filter(l => l.emp === emp && l.type === k && l.status === 'Approved' && l.from.slice(0, 4) === TODAY.slice(0, 4)), l => l.days); out[k] = { ent: ent[k], bal: ent[k] - used }; }); return out; }

function attSummary(emp, ym) { const a = all('att').filter(x => x.emp === emp && x.date.slice(0, 7) === ym); return { present: sum(a, x => x.st === 'Present' || x.st === 'Late' ? 1 : x.st === 'Half Day' ? .5 : 0), late: a.filter(x => x.st === 'Late').length, absent: a.filter(x => x.st === 'Absent').length + sum(a, x => x.st === 'Half Day' ? .5 : 0), leave: a.filter(x => x.st === 'On Leave').length, wo: a.filter(x => x.st === 'Weekly Off').length, ot: sum(a, x => x.ot), days: a.length }; }

/* ---------- payroll ---------- */
function calcSlip(e, ym) {
  const ec = ENT[e.ent], D = daysIn(ym), a = attSummary(e.id, ym), paid = Math.min(D, a.present + a.leave + a.wo), f = paid / D, B = e.basic || 0, A = e.allow || 0, L = [], Dd = [];
  if (ec.code === 'IN') {
    L.push(['Basic', B * f], ['HRA (40% of basic)', B * .4 * f], ['Special allowance', A * f], ['Overtime (' + fmtN(a.ot) + ' h × 2)', B / 26 / 8 * 2 * a.ot]);
    const g = sum(L, x => x[1]); Dd.push(['Provident Fund (12% of basic, capped)', Math.min(B * f, 15000) * .12]); if (g <= 21000) Dd.push(['ESI (0.75%)', Math.ceil(g * .0075)]); if (g > 10000) Dd.push(['Professional tax (state slab)', 200]);
  } else if (ec.code === 'AE') {
    L.push(['Basic', B * f], ['Housing & transport', A * f], ['Overtime (' + fmtN(a.ot) + ' h × 1.25)', B / 30 / 8 * 1.25 * a.ot]);
  } else {
    L.push(['Basic salary', B * f], ['Allowances', A * f], ['Overtime (' + fmtN(a.ot) + ' h × 1.5)', B * 12 / 52 / 37.5 * 1.5 * a.ot]);
    const g = sum(L, x => x[1]); Dd.push(['Income tax — PAYE (simplified 20%)', Math.max(0, g - 1048) * .2], ['National Insurance (simplified 8%)', Math.max(0, g - 1048) * .08], ['Workplace pension (5%)', g * .05]);
  }
  const gross = sum(L, x => x[1]), ded = sum(Dd, x => x[1]);
  return { emp: e.id, name: e.name, dept: e.dept, cur: ec.cur, D, paid, lop: D - paid, ot: a.ot, earn: L.map(x => [x[0], Math.round(x[1])]), ded: Dd.map(x => [x[0], Math.round(x[1])]), gross: Math.round(gross), net: Math.round(gross - ded), bank: e.bank };
}
function calcWages(e, ym) { const c = get('con', e.con) || {}, a = attSummary(e.id, ym), w = c.wage || 0, gross = Math.round(w * a.present + w / 8 * 2 * a.ot), pf = Math.round(gross * .12), esi = Math.ceil(gross * .0075); return { emp: e.id, name: e.name, con: e.con, days: a.present, ot: a.ot, rate: w, gross, pf, esi, net: gross - pf - esi, below: w < MINWAGE }; }
defDT({ name: 'pay', sys: 'hrms', label: 'Payroll Run', prefix: 'PAY', module: 'Payroll', desc: 'Monthly payroll per entity, straight from attendance. Contract wages are computed for CLRA registers in the same run.', title: r => r.ent + ' · ' + r.month, titleLabel: 'Entity · Month',
  states: ['Draft', 'Calculated', 'Approved', 'Paid'], editIn: ['Draft', 'Calculated'],

  flow: [{ a: 'Calculate payroll', from: ['Draft', 'Calculated'], to: 'Calculated', p: 1, run: r => {
    if (!/^\d{4}-\d{2}$/.test(r.month)) return { err: 'Month must look like 2026-10.' };
    const st = all('emp').filter(e => e.ent === r.ent && e.type === 'Staff' && e.status !== 'Exited'); r.slips = st.map(e => calcSlip(e, r.month));

function todayStatus(e) {
  const sh = get('shift', e.shift) || { start: '09:00', grace: 10 }, ps = all('punch').filter(p => p.emp === e.id && p.date === TODAY && p.res === 'Accepted');
  const den = all('punch').filter(p => p.emp === e.id && p.date === TODAY && p.res !== 'Accepted').slice(-1)[0];
  if (isSun(TODAY)) return { st: 'Weekly Off' };
  const lv = all('att').find(a => a.emp === e.id && a.date === TODAY && a.st === 'On Leave'); if (lv) return { st: 'On Leave' };
  if (!ps.length) { if (den) return { st: 'Denied', note: den.res }; return { st: t2m(nowTime()) < t2m(sh.start) ? 'Shift not started' : 'Not in yet' }; }
  const inT = ps[0].time, outT = ps.length > 1 ? ps[ps.length - 1].time : '';
  return { st: t2m(inT) > t2m(sh.start) + (sh.grace || 0) ? 'Late' : 'Present', in: inT, out: outT };
}
function doPunch(empId, dev) {
  const e = get('emp', empId); let res = 'Accepted';
  if (e.type === 'Contract') { const c = get('con', e.con); const pres = all('emp').filter(x => x.con === c.id && x.id !== e.id && ['Present', 'Late'].includes(todayStatus(x).st)).length; if (diffDays(c.valid, TODAY) < 0) res = 'Denied — contractor licence expired'; else if (pres >= c.max && !['Present', 'Late'].includes(todayStatus(e).st)) res = 'Denied — licensed headcount reached'; }
  const p = insert('punch', { emp: e.id, date: TODAY, time: nowTime(), dev, res }, false); logIt('emp', e.id, 'Device punch at ' + dev + ': ' + res); return p;
}

const STDS = { 'ISO 9001:2015': ISO9001, 'ISO 14001:2015': ISO14001, 'ISO 45001:2018': ISO45001 };
const AREAS = { 'Top management': ['4.1', '4.2', '4.3', '4.4', '5.1', '5.2', '5.3', '6.1', '6.2', '6.3', '9.3', '10.3'], Purchasing: ['7.5', '8.4', '8.7', '9.1', '10.2'], Production: ['7.1', '7.2', '7.5', '8.1', '8.5', '8.6', '8.7', '9.1'], Stores: ['7.5', '8.5', '8.7'], Maintenance: ['7.1', '7.5', '8.5', '9.1'], 'HR & training': ['7.2', '7.3', '7.4', '7.5'], 'Quality control': ['7.1', '7.5', '8.6', '8.7', '9.1', '10.2'], 'Design & engineering': ['7.5', '8.3', '8.7'], 'Whole system': ISO9001.map(c => c[0]) };

      return `<div class="m-h">Leave</div><div class="m-grid">${Object.keys(b).map(k => `<div class="m-kpi"><b>${b[k].bal}</b><span>${k}</span></div>`).join('')}</div>
        <div class="m-card"><div class="m-t" style="margin-bottom:8px">Apply for leave</div><select class="m-in" data-mf="lt">${['Casual', 'Sick', 'Earned'].map(t => `<option ${M.f.lt === t ? 'selected' : ''}>${t}</option>`).join('')}</select><div style="display:flex;gap:6px"><input class="m-in" type="date" data-mf="lf" value="${esc(M.f.lf || addDays(TODAY, 7))}" aria-label="From"><input class="m-in" type="date" data-mf="lto" value="${esc(M.f.lto || addDays(TODAY, 7))}" aria-label="To"></div><input class="m-in" data-mf="lw" placeholder="Reason" value="${esc(M.f.lw || '')}">${mbtn('Send to manager', 'mleave', {}, 'pri wide')}</div>
        ${mine.map(l => mrow(esc(l.type) + ' · ' + l.days + ' d', chip(l.status), fmtDate(l.from) + ' → ' + fmtDate(l.to))).join('')}`; }
    const sl = calcSlip(e, prevMonth());
    return `<div class="m-h">Payslip</div><div class="m-card" style="background:linear-gradient(135deg,#1D4ED8,#0EA5E9);border:0"><div class="m-s" style="color:#DBEAFE">Net pay · ${prevMonth()}</div><div style="font-size:30px;font-weight:800">${fmtCur(sl.net, sl.cur)}</div><div class="m-s" style="color:#DBEAFE">${fmtN(sl.paid)} of ${sl.D} days paid</div></div>${sl.earn.map(x => mrow(esc(x[0]), `<span class="m-num">${fmtCur(x[1], sl.cur)}</span>`)).join('')}${sl.ded.map(x => mrow(esc(x[0]), `<span class="m-num" style="color:#FCA5A5">−${fmtCur(x[1], sl.cur)}</span>`)).join('')}${mbtn('Download PDF', 'mtoast', { m: 'Payslip PDF saved to your phone (demo).' }, 'wide')}`;
  }
  if (app === 'qms') {
    if (tab === 'insp') { const q = all('qc').filter(x => x.status === 'Pending');
      return `<div class="m-h">Inspections <span class="m-badge">${q.length}</span></div>${q.map(x => `<div class="m-card"><div class="m-s">${esc(x.id)} · ${esc(x.type)}</div><div class="m-t">${esc(x.lines.map(l => itemName(l.item) + ' × ' + l.qty).join(', '))}</div><div class="m-s" style="margin:4px 0">${x.params.length} checks · sample ${x.lines[0] ? x.lines[0].sample : ''}</div><div class="m-acts">${mbtn('All OK → release', 'mqc', { id: x.id }, 'pri')}${mbtn('Open', 'nav', { h: '#/erp/f/qc/' + x.id })}</div></div>`).join('') || '<div class="m-empty">No lots waiting. Receive goods or complete a work order in the ERP to create one.</div>'}`; }
    if (tab === 'ncr') return `<div class="m-h">Raise NCR</div><div class="m-card"><div class="m-photo">📷 Tap to add photos</div><select class="m-in" data-mf="ns">${['Minor', 'Major', 'Critical'].map(t => `<option ${M.f.ns === t ? 'selected' : ''}>${t}</option>`).join('')}</select><select class="m-in" data-mf="nsrc">${['In-process', 'Final inspection', 'Incoming inspection', 'Supplier'].map(t => `<option ${M.f.nsrc === t ? 'selected' : ''}>${t}</option>`).join('')}</select><textarea class="m-in" data-mf="nd" rows="3" placeholder="What did you find?">${esc(M.f.nd || '')}</textarea>${mbtn('Submit NCR', 'mncr', {}, 'pri wide')}</div>${all('ncr').slice(-3).reverse().map(n => mrow(esc(n.id), chip(n.status), esc((n.desc || '').slice(0, 50)))).join('')}`;
    return `<div class="m-h">Gauges</div>${all('cal').map(c => { const d = diffDays(addDays(c.last, c.freq), TODAY); return mrow(esc(c.name), `<span class="st ${d < 0 ? 's4' : d <= 30 ? 's1' : 's3'}">${d < 0 ? 'Overdue' : d + ' d'}</span>`, esc(c.tag) + ' · ' + esc(c.loc)); }).join('')}<div class="m-note">Scan the QR tag on a gauge to see its certificate before use.</div>`;
  }
  if (app === 'dms') { const e = get('emp', MOB_SUP);
    if (tab === 'read') { const docs = all('doc').filter(d => d.status === 'Released' && d.dist.some(x => x.emp === e.id && !x.ack));
      return `<div class="m-h">To read <span class="m-badge">${docs.length}</span></div>${docs.map(d => `<div class="m-card"><div class="m-s mono">${esc(d.no)} · Rev ${esc(d.rev)}</div><div class="m-t" style="margin:2px 0 6px">${esc(d.title)}</div><div class="m-s">Effective ${fmtDate(d.eff)}</div><div class="m-acts">${mbtn('I have read it', 'mack', { id: d.id }, 'pri')}</div></div>`).join('') || '<div class="m-empty">You are up to date ✓</div>'}${all('doc').filter(d => d.status === 'Released' && d.dist.some(x => x.emp === e.id && x.ack)).slice(0, 3).map(d => mrow(esc(d.title), '<span class="st s3">Read</span>', esc(d.no))).join('')}`; }
    const q = (M.f.dq || '').toLowerCase(); const docs = all('doc').filter(d => d.status === 'Released' && (!q || (d.title + d.no).toLowerCase().includes(q)));
    return `<div class="m-h">Library</div><input class="m-in" data-mf="dq" placeholder="Search SOPs, drawings…" value="${esc(M.f.dq || '')}">${docs.slice(0, 10).map(d => mrow(esc(d.title), `<span class="m-num">Rev ${esc(d.rev)}</span>`, esc(d.no) + ' · ' + esc(d.type))).join('')}<div class="m-note">Only the current released revision opens on the shop floor.</div>`;
  }
  if (app === 'vms') { const h = MOB_HOST;
    if (tab === 'wait') { const w = all('visit').filter(v => v.status === 'Waiting for Host');
      return `<div class="m-h">Visitor requests <span class="m-badge">${w.length}</span></div>${w.map(v => `<div class="m-card"><div style="display:flex;gap:10px;align-items:center"><div class="m-ava">${esc(v.name.split(' ').map(x => x[0]).join('').slice(0, 2))}</div><div><div class="m-t">${esc(v.name)}</div><div class="m-s">${esc(v.company)} · ${esc(v.purpose)} · for ${esc(empName(v.host))}</div></div></div><div class="m-acts">${mbtn('Approve', 'mvis', { id: v.id, s: 'ok' }, 'pri')}${mbtn('Deny', 'mvis', { id: v.id, s: 'no' })}</div></div>`).join('') || '<div class="m-empty">No one waiting at reception.</div>'}`; }
    if (tab === 'invite') return `<div class="m-h">Invite a visitor</div><div class="m-card"><input class="m-in" data-mf="vn" placeholder="Visitor name" value="${esc(M.f.vn || '')}"><input class="m-in" data-mf="vc" placeholder="Company" value="${esc(M.f.vc || '')}"><div style="display:flex;gap:6px"><input class="m-in" type="date" data-mf="vd" value="${esc(M.f.vd || TODAY)}" aria-label="Date"><input class="m-in" type="time" data-mf="vt" value="${esc(M.f.vt || '15:00')}" aria-label="Time"></div>${mbtn('Send invitation', 'minv', {}, 'pri wide')}<div class="m-s" style="margin-top:6px">They get an email with a QR code for 10-second check-in.</div></div>`;
    const t = all('visit').filter(v => v.host === h || v.status === 'Inside');
    return `<div class="m-h">Today</div>${t.map(v => mrow(esc(v.name), chip(v.status), esc(v.company) + (v.tin ? ' · in ' + v.tin : ''))).join('')}${all('vpr').filter(v => v.host === h && v.status === 'Invited').map(v => mrow(esc(v.name), '<span class="st s0">Expected</span>', esc(v.company) + ' · ' + esc(v.time || ''))).join('')}`;
  }
  const s = SCORE();
  if (tab === 'kpi') return `<div class="m-h">Scorecard</div>${s.map(x => mrow(esc(x[1]), `<span class="st ${x[4] ? 's3' : 's4'}">${esc(String(x[2]))}</span>`, 'Target ' + esc(x[3]))).join('')}`;
  return `<div class="m-h">Live</div><div class="m-grid">${[['On site', all('emp').filter(e => e.ent === 'India — Pune plant' && ['Present', 'Late'].includes(todayStatus(e).st)).length], ['Visitors', all('visit').filter(v => v.status === 'Inside').length], ['Open WOs', all('wo').filter(w => w.status !== 'Completed').length], ['Open NCRs', all('ncr').filter(n => n.status !== 'Closed').length]].map(x => `<div class="m-kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div><div class="m-card">${barChart(S.hist.prod.map(w => ({ l: w[0], v: w[2] })), { h: 170, w: 320, color: '#3B82F6', label: 'Weekly output' })}</div>`;
}
function phone(os, appId) {
  const M = mobState(), app = MAPPS.find(a => a.id === appId), tab = M.tab[appId] || app.tabs[0][0];
  const ios = os === 'ios';
  return `<div class="phone-f ${ios ? 'ios' : 'and'}"><div class="ph-scr">
    <div class="ph-sb"><span>${ios ? '9:41' : nowTime()}</span>${ios ? '<i class="ph-island"></i>' : '<i class="ph-hole"></i>'}<span>▂▄▆ ▮</span></div>
    <div class="ph-app ${ios ? '' : 'md'}"><div class="ph-top">${ios ? '' : '<span style="font-size:18px">☰</span>'}<div style="flex:1;min-width:0"><div class="ph-name">${esc(app.name)}</div><div class="m-s">${esc(app.who)}</div></div><img src="${LOGO_SRC}" alt="" style="height:22px"></div>
    <div class="ph-body">${mobScreen(appId, tab)}</div></div>
    <div class="ph-tabs">${app.tabs.map(t => `<button class="${t[0] === tab ? 'on' : ''}" data-a="mtab" data-app="${appId}" data-t="${t[0]}"><span class="ti">${t[2]}</span>${esc(t[1])}</button>`).join('')}</div>
    <div class="ph-home"></div></div></div>`;
}
PAGES.mobile = { label: 'Android & iPhone apps', render: sys => { const M = mobState();
  return `${crumbs(sys)}<div class="hd"><div><h1>Mobile apps for Android &amp; iPhone</h1><p>Every KM system ships with a mobile app built in Flutter — one codebase, native apps for both stores. These phones run on the same live data as the web systems: approve here and the ERP updates instantly.</p></div>
  <div class="row"><div class="chips" style="margin:0"><button class="chip ${M.os === 'ios' ? 'on' : ''}" data-a="mos" data-v="ios">iPhone</button><button class="chip ${M.os === 'android' ? 'on' : ''}" data-a="mos" data-v="android">Android</button><button class="chip ${M.os === 'both' ? 'on' : ''}" data-a="mos" data-v="both">Side by side</button></div></div></div>
  <div class="chips">${MAPPS.map(a => `<button class="chip ${M.app === a.id ? 'on' : ''}" data-a="mapp" data-v="${a.id}">${esc(a.name)}</button>`).join('')}</div>
  <div class="lay"><div class="l" style="display:flex;gap:28px;flex-wrap:wrap;justify-content:center">${M.os === 'both' ? phone('ios', M.app) + phone('android', M.app) : phone(M.os, M.app)}</div>
  <div class="r"><div class="card"><b>What this app does</b><div class="feed" style="margin-top:10px">${({ erp: ['Approve requisitions, purchase orders and CAPEX on the go — the same value limits apply.', 'Check live stock or scan a barcode.', 'Security marks vehicles in and out at the gate.'], hrms: ['Employees punch in with face match inside the plant geofence.', 'Apply for leave and see balances.', 'Download payslips — no more HR queues.'], qms: ['Inspectors record results at the machine and release lots.', 'Raise an NCR with photos from the shop floor.', 'Check gauge calibration before use.'], dms: ['Workers read and acknowledge new SOP revisions.', 'Search the library — only current revisions open.'], vms: ['Hosts approve visitors waiting at reception.', 'Invite visitors with a QR code for fast check-in.'], bi: ['Management sees the plant scorecard and live counts anywhere.'] }[M.app] || []).map(x => `<div><span>${esc(x)}</span></div>`).join('')}</div>
  <div class="sec">Built for both stores</div><div class="feed"><div><span>Flutter → Android (Play Store) and iOS (App Store) from one codebase</span></div><div><span>Push notifications for approvals and visitor arrivals</span></div><div><span>Works offline on the shop floor; syncs when back online</span></div><div><span>Biometric login (Face ID / fingerprint) and company SSO</span></div><div><span>Your branding — your logo, your colours, your app name</span></div></div></div></div></div>`;
} };
ACT.mos = el => { mobState().os = el.dataset.v; rerender(); };
ACT.mapp = el => { mobState().app = el.dataset.v; rerender(); };
ACT.mtab = el => { mobState().tab[el.dataset.app] = el.dataset.t; rerender(); };
ACT.mtoast = el => toast(el.dataset.m);
ACT.mappr = el => { const r = get(el.dataset.dt, el.dataset.id); const prev = S.settings.user; S.settings.user = 'Plant Head'; const res = approveNext(el.dataset.dt, r); S.settings.user = prev; save(); toast(res.err || res.msg, !!res.err); rerender(); };
ACT.mgate = el => { const g = get('ge', el.dataset.id); if (el.dataset.s === 'in') { if (!g.vehicle) g.vehicle = 'TRK-' + (1000 + Math.floor(Math.random() * 9000)); g.tin = TODAY + ' ' + nowTime(); setStatus('ge', g, 'Inside', 'Gate in (mobile)'); } else { g.tout = TODAY + ' ' + nowTime(); setStatus('ge', g, 'Exited', 'Gate out (mobile)'); } save(); toast(g.vehicle + (el.dataset.s === 'in' ? ' marked inside.' : ' marked out.')); rerender(); };
ACT.mpunch = () => { const p = doPunch(MOB_EMP, 'Mobile app · face + GPS'); save(); toast(p.res === 'Accepted' ? 'Punch recorded at ' + p.time + ' — visible in HRMS live attendance.' : p.res, p.res !== 'Accepted'); rerender(); };
ACT.mleave = () => { const f = mobState().f; const r = insert('leave', { emp: MOB_EMP, type: f.lt || 'Casual', from: f.lf || addDays(TODAY, 7), to: f.lto || f.lf || addDays(TODAY, 7), why: f.lw || 'Applied from mobile', status: 'Pending' }, 'Applied from mobile app'); if (r.to < r.from) { r.to = r.from; DT.leave.compute(r); } save(); f.lw = ''; toast(r.id + ' sent to your manager — it is now in HRMS → Leave Applications.'); rerender(); };
ACT.mqc = el => { const q = get('qc', el.dataset.id); q.inspector = q.inspector || 'K. Iyer'; q.params.forEach(p => { p.res = p.res || 'OK'; p.obs = p.obs || 'OK'; }); const a = DT.qc.flow[0]; const res = a.run(q); if (res && res.err) { toast(res.err, true); return; } setStatus('qc', q, 'Released', 'Released from mobile app'); save(); toast(res.msg); rerender(); };
ACT.mncr = () => { const f = mobState().f; if (!(f.nd || '').trim()) { toast('Describe what you found.', true); return; } const n = insert('ncr', { source: f.nsrc || 'In-process', sev: f.ns || 'Minor', desc: f.nd, owner: 'Asha Verma', due: addDays(TODAY, 7) }, 'Raised from mobile app with photos'); f.nd = ''; save(); toast(n.id + ' raised — QA has been notified.'); rerender(); };
ACT.mack = el => { const d = get('doc', el.dataset.id); const row = d.dist.find(x => x.emp === MOB_SUP && !x.ack); if (row) { row.ack = TODAY; logIt('doc', d.id, empName(MOB_SUP) + ' acknowledged rev ' + d.rev + ' on mobile'); } save(); toast('Acknowledged ' + d.no + ' rev ' + d.rev + '.'); rerender(); };
ACT.mvis = el => { const v = get('visit', el.dataset.id); if (el.dataset.s === 'ok') { v.ind = true; v.tin = nowTime(); v.badge = 'V-' + v.id.slice(-4); setStatus('visit', v, 'Inside', 'Approved by host on mobile'); } else setStatus('visit', v, 'Denied', 'Denied by host on mobile'); save(); toast(v.name + (el.dataset.s === 'ok' ? ' approved — badge printing at reception.' : ' denied.')); rerender(); };
ACT.minv = () => { const f = mobState().f; if (!(f.vn || '').trim()) { toast('Enter the visitor name.', true); return; } const r = insert('vpr', { name: f.vn, company: f.vc || '', host: MOB_HOST, date: f.vd || TODAY, time: f.vt || '15:00', purpose: 'Meeting' }, 'Invited from mobile app'); f.vn = ''; f.vc = ''; save(); toast('Invitation sent. Check-in code K' + r.id.slice(-4) + '.'); rerender(); };
document.addEventListener('input', e => { const k = e.target.dataset.mf; if (k && VIEW.mob) { VIEW.mob.f[k] = e.target.value; if (k === 'sq' || k === 'dq') { const pos = e.target.selectionStart; rerender(); const n = document.querySelector(`[data-mf="${k}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } } } } });
document.addEventListener('change', e => { const k = e.target.dataset.mf; if (k && VIEW.mob) VIEW.mob.f[k] = e.target.value; });
SYSINFO.mob = ['Android & iPhone apps for every system', 'ERP approvals · Employee self-service · Inspector app · Read & acknowledge · Host approvals · Management KPIs'];
SYSTEMS.push({ id: 'mob', short: 'Mobile apps', name: 'KM Mobile', nav: [{ g: 'Apps', items: [['page', 'mobile']] }], dash: () => PAGES.mobile.render(SYSTEMS.find(s => s.id === 'mob')) });

load();
render();

</script>
</body>
</html>
